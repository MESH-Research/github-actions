name: Build
description: "Builds the Docker images for Pilcrow"
inputs:
  target:
    description: "package to build"
    required: false
    default: "ci"
  token:
    description: "GitHub token to use for authentication"
  push:
    description: "Push the built images to the registry"
    required: false
    default: "true"
outputs:
  version:
    description: "Version of the package that was built"
    value: ${{ steps.parse-build-output.outputs.version }}
  tags:
    description: "List of tags"
    value: ${{ steps.docker-input-metadata.outputs.tags}}
  frontend-bundle:
    description: "Path to the frontend bundle"
    value: ${{ steps.parse-build-output.outputs.frontend-bundle }}
runs:
  using: "composite"
  steps:
    - uses: mesh-research/github-actions/pilcrow-toolkit@main
      id: setup
      with:
        target: ${{ inputs.target }}
        command: setup
    - uses: docker/setup-buildx-action@v3
      with:
          # Use the 'docker-container' driver for advanced features like multi-platform builds
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-flags: |
            --allow-insecure-entitlement network.host
      id: buildx
    - uses: oras-project/setup-oras@v1.2.3
    # - name: Cache
    #   uses: actions/cache@v3
    #   id: docker-yarn-cache
    #   with:
    #     path: |
    #       ${RUNNER_TEMP}/yarn-cache
    #     key: cache-yarn-${{ hashFiles('client/package.json', 'client/yarn.lock') }}
    #     restore-keys: |
    #       cache-yarn-
    # - name: inject cache into docker
    #   uses: reproducible-containers/buildkit-cache-dance@v3.1.0
    #   with:
    #     cache-map: |
    #       {
    #         "${RUNNER_TEMP}/yarn-cache": "/usr/local/share/.cache/yarn/v6"
    #       }
    #     skip-extraction: ${{ steps.docker-yarn-cache.outputs.cache-hit }}
    - name: Docker Meta
      id: docker-input-metadata
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.setup.outputs.image-template }}
        tags: |
          type=edge
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    - uses: int128/docker-build-cache-config-action@v1
      id: docker-registry-cache
      with:
        image: ${{ steps.setup.outputs.docker-registry-cache }}
        pull-request-cache: true
    - name: Prepare Build
      uses: mesh-research/github-actions/pilcrow-toolkit@main
      with:
        command: pre-build
        bake-files: |
          ./docker-bake.hcl
          ${{ steps.docker-input-metadata.outputs.bake-file }}
          ${{ steps.docker-registry-cache.outputs.bake-file }}
    - name: Execute Docker Bake
      id: docker-bake
      uses: docker/bake-action@v6.8.0
      env:
        BUILDSTAMP: ${{ steps.setup.outputs.buildstamp }}
        VERSION: ${{ steps.setup.outputs.version }}
        VERSION_URL: ${{ steps.setup.outputs.version-url }}
        VERSION_DATE: ${{ steps.setup.outputs.version-date }}
      with:
        push: ${{ inputs.push }}
        source: .
        targets: ${{ inputs.target }}
        allow: fs.write=*,network.host
        files: |
          ./docker-bake.hcl
          ${{ steps.docker-input-metadata.outputs.bake-file }}
          ${{ steps.docker-registry-cache.outputs.bake-file }}
    # The full bake metadata can exceed Linux's 128 KiB MAX_ARG_STRLEN limit for
    # a single environment variable (worse on pull_request, which adds tags/cache
    # scopes). Passing it straight into the `docker-metadata` input below makes it
    # the INPUT_DOCKER-METADATA env var, and `execve` of the node action then fails
    # with "Argument list too long" (breaking both the main and post steps, since
    # post inherits INPUT_*). parse-build-output only needs each target's
    # "image.name", so slim the metadata down before handing it off.
    - name: Slim bake metadata
      id: slim-metadata
      shell: bash
      run: |
        # Embed the metadata via a quoted heredoc: it lands in the script body (a
        # file the runner executes), not in argv/env, so it dodges the size limit.
        cat > "${RUNNER_TEMP}/bake-metadata-full.json" <<'__BAKE_METADATA_EOF__'
        ${{ steps.docker-bake.outputs.metadata }}
        __BAKE_METADATA_EOF__
        jq -c '(. // {}) | map_values({"image.name": .["image.name"]})' \
          "${RUNNER_TEMP}/bake-metadata-full.json" > "${RUNNER_TEMP}/bake-metadata-slim.json"
        echo "metadata=$(cat "${RUNNER_TEMP}/bake-metadata-slim.json")" >> "$GITHUB_OUTPUT"
    - name: Parse Docker Metadata Output
      id: parse-build-output
      uses: mesh-research/github-actions/pilcrow-toolkit@main
      with:
        command: parse-build-output
        docker-metadata: ${{ steps.slim-metadata.outputs.metadata }}
